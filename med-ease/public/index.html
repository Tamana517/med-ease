<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>MedEase — Recovery Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-dark:#013A40;
    --teal:#028090;
    --seafoam:#00A896;
    --mint:#02C39A;
    --off-white:#F7FBFA;
    --card:#FFFFFF;
    --text-dark:#0B2B2E;
    --text-muted:#5B7A7D;
    --border:#E1EEEC;
    --amber:#F0A202;
    --danger:#D8544A;
    --shadow: 0 10px 30px -8px rgba(1,58,64,0.18);
    --radius: 18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 100% 0%, rgba(2,128,144,0.10), transparent 45%),
      radial-gradient(circle at 0% 100%, rgba(0,168,150,0.10), transparent 45%),
      var(--off-white);
    color:var(--text-dark);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--off-white);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  header.topbar{
    display:flex;align-items:center;gap:10px;
    padding:16px 20px 12px;
    background:var(--teal-dark);
    color:#fff;
    position:sticky; top:0; z-index:20;
  }
  .logo-mark{
    width:34px;height:34px;border-radius:50%;
    background:var(--teal);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .logo-mark svg{width:18px;height:18px;}
  .brand{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:20px;
    letter-spacing:0.2px;
  }
  .brand small{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:10.5px;
    letter-spacing:1.2px;
    color:var(--mint);
    text-transform:uppercase;
  }
  /* Journey rail — always visible, shows where we are across the 4 mini challenges */
  .journey-rail{
    display:flex; background:#02292E; padding:10px 14px; gap:4px;
    position:sticky; top:66px; z-index:19; overflow-x:auto;
  }
  .journey-rail::-webkit-scrollbar{display:none;}
  .jr-step{
    flex:1; min-width:64px; text-align:center; padding:6px 4px; border-radius:10px;
    font-size:9.5px; font-weight:700; color:rgba(255,255,255,0.38); letter-spacing:.3px;
    white-space:nowrap; transition:.2s;
  }
  .jr-step.done{ color:rgba(2,195,154,0.85); }
  .jr-step.active{ background:rgba(2,195,154,0.16); color:var(--mint); }

  main{
    flex:1;
    padding:22px 20px 100px;
    animation:fadeIn 0.35s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{
    font-size:11.5px; font-weight:700; letter-spacing:1.6px;
    color:var(--seafoam); text-transform:uppercase; margin:0 0 6px;
  }
  h1.page-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:26px;
    margin:0 0 8px; line-height:1.22; color:var(--text-dark);
  }
  p.page-sub{
    color:var(--text-muted); font-size:14px; line-height:1.5; margin:0 0 26px;
  }

  /* Home screen: three tier cards */
  .tier-grid{display:flex;flex-direction:column;gap:10px}
  .tier-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:15px;display:flex;gap:12px;align-items:center;cursor:pointer;box-shadow:0 5px 16px -8px rgba(1,58,64,.16);transition:.18s;font:inherit;color:inherit;text-align:left;width:100%}
  .tier-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px -10px rgba(1,58,64,.22)}
  .tier-num{width:34px;height:34px;border-radius:11px;background:var(--teal-dark);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
  .tier-card h3{margin:0 0 3px;font-size:14px}.tier-card p{margin:0;color:var(--text-muted);font-size:11.5px;line-height:1.4}
  .tier-status{margin-left:auto;font-size:9.5px;font-weight:800;text-transform:uppercase;color:var(--mint);white-space:nowrap}

  /* Upload flow */
  .upload-zone{
    border:2px dashed var(--border); border-radius:var(--radius);
    padding:38px 20px; text-align:center; background:var(--card); cursor:pointer;
  }
  .upload-zone svg{ width:38px; height:38px; margin-bottom:10px; }
  .upload-zone h3{ font-size:15px; margin:0 0 6px; }
  .upload-zone p{ font-size:12.5px; color:var(--text-muted); margin:0; }
  input[type=file]{ display:none; }

  .processing{ display:flex; flex-direction:column; align-items:center; padding:50px 10px; text-align:center; }
  .spinner{
    width:52px;height:52px;border-radius:50%;
    border:4px solid var(--border); border-top-color:var(--teal);
    animation:spin 0.9s linear infinite; margin-bottom:22px;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  .step-list{ text-align:left; width:100%; max-width:300px; margin-top:6px; }
  .step-row{ display:flex; align-items:center; gap:10px; padding:7px 0; font-size:13px; color:var(--text-muted); }
  .step-row.done{ color:var(--text-dark); font-weight:600; }
  .step-dot{ width:18px;height:18px;border-radius:50%; border:2px solid var(--border); flex-shrink:0; display:flex;align-items:center;justify-content:center; }
  .step-row.done .step-dot{ background:var(--mint); border-color:var(--mint); }
  .step-row.done .step-dot::after{ content:'✓'; color:#fff; font-size:10px; font-weight:800; }

  /* NFC flow */
  .nfc-stage{ display:flex; flex-direction:column; align-items:center; padding:20px 10px 10px; text-align:center; }
  .nfc-ring{
    width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle, rgba(2,195,154,0.18), transparent 70%);
    display:flex;align-items:center;justify-content:center;
    position:relative; margin-bottom:22px;
  }
  .nfc-ring::before, .nfc-ring::after{
    content:''; position:absolute; border-radius:50%;
    border:2px solid rgba(0,168,150,0.35);
    animation:pulse 2s ease-out infinite;
  }
  .nfc-ring::before{ width:100%; height:100%; }
  .nfc-ring::after{ width:100%; height:100%; animation-delay:1s; }
  @keyframes pulse{ 0%{ transform:scale(0.7); opacity:0.9;} 100%{ transform:scale(1.35); opacity:0;} }
  .nfc-core{
    width:92px;height:92px;border-radius:50%;background:var(--teal);
    display:flex;align-items:center;justify-content:center; z-index:2;
    box-shadow:0 8px 22px -4px rgba(2,128,144,0.5);
  }
  .nfc-core svg{ width:44px;height:44px; }
  .nfc-status{ font-size:14px; font-weight:600; margin-bottom:4px; }
  .nfc-hint{ font-size:12px; color:var(--text-muted); max-width:280px; margin:0 auto 18px; }

  .location-row{ display:flex; gap:8px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
  .loc-chip{
    border:1.5px solid var(--border); background:var(--card); border-radius:30px;
    padding:7px 14px; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer;
  }
  .loc-chip.active{ background:var(--teal-dark); border-color:var(--teal-dark); color:#fff; }

  button.btn{
    border:none; border-radius:14px; padding:14px 20px; font-size:14.5px; font-weight:700;
    cursor:pointer; width:100%; font-family:inherit;
  }
  .btn-primary{ background:var(--teal-dark); color:#fff; }
  .btn-primary:active{ background:var(--teal); }
  .btn-outline{ background:transparent; border:1.5px solid var(--teal-dark); color:var(--teal-dark); }
  .btn-ghost{ background:transparent; color:var(--text-muted); font-weight:600; font-size:13px; padding:10px; }

  /* Checklist screen */
  .patient-banner{
    background:var(--teal-dark); color:#fff; border-radius:var(--radius);
    padding:16px 18px; display:flex; align-items:center; gap:12px; margin-bottom:18px;
  }
  .avatar{ width:42px;height:42px;border-radius:50%; background:var(--teal); display:flex;align-items:center;justify-content:center; font-weight:800; font-family:'Fraunces',serif; flex-shrink:0; }
  .patient-banner .name{ font-weight:700; font-size:15px; }
  .patient-banner .meta{ font-size:11.5px; color:var(--mint); font-weight:600; letter-spacing:0.3px; }
  .source-pill{
    margin-left:auto; font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
    background:rgba(255,255,255,0.14); padding:4px 9px; border-radius:20px; white-space:nowrap;
  }

  .section-label{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color:var(--text-muted); margin:20px 0 10px; display:flex; align-items:center; justify-content:space-between; }
  .lang-switch{ display:flex; gap:4px; background:#EFF3F2; border-radius:20px; padding:3px; }
  .lang-btn{ border:none; background:none; font:inherit; font-size:10.5px; font-weight:800; padding:5px 10px; border-radius:16px; cursor:pointer; color:var(--text-muted); }
  .lang-btn.active{ background:var(--teal-dark); color:#fff; }

  .check-card{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:13px 14px; margin-bottom:10px; box-shadow:0 4px 14px -6px rgba(1,58,64,0.10);
  }
  .check-box{ width:22px;height:22px;border-radius:7px; background:var(--mint); flex-shrink:0; display:flex;align-items:center;justify-content:center; margin-top:1px; }
  .check-box svg{ width:13px;height:13px; }
  .check-text{ flex:1; }
  .check-text b{ display:block; font-size:13.5px; margin-bottom:2px; }
  .check-text span{ font-size:12px; color:var(--text-muted); }
  .flag-card{ border-color:rgba(216,84,74,0.35); background:rgba(216,84,74,0.05); }
  .flag-card .check-box{ background:var(--danger); }
  .speak-btn{
    flex-shrink:0; width:28px;height:28px;border-radius:50%; border:1px solid var(--border); background:var(--off-white);
    display:flex;align-items:center;justify-content:center; cursor:pointer; color:var(--teal-dark);
  }
  .speak-btn:active{ background:var(--mint); color:#fff; border-color:var(--mint); }
  .speak-btn svg{ width:13px;height:13px; }

  /* Adherence log */
  .log-entry{
    display:flex; align-items:center; gap:12px; padding:11px 0;
    border-bottom:1px solid var(--border);
  }
  .log-entry:last-child{ border-bottom:none; }
  .log-icon{ width:34px;height:34px;border-radius:50%; background:var(--off-white); display:flex;align-items:center;justify-content:center; flex-shrink:0; border:1px solid var(--border); }
  .log-icon svg{ width:16px;height:16px; }
  .log-main{ flex:1; }
  .log-main b{ font-size:13px; display:block; }
  .log-main span{ font-size:11.5px; color:var(--text-muted); }
  .log-time{ font-size:11px; color:var(--text-muted); text-align:right; white-space:nowrap; }

  .empty-log{ text-align:center; padding:40px 10px; color:var(--text-muted); }
  .empty-log svg{ width:34px;height:34px; margin-bottom:10px; opacity:0.5; }
  .empty-log p{ font-size:13px; margin:0; }

  /* Bottom nav */
  nav.tabbar{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%);
    width:100%; max-width:480px; background:#fff; border-top:1px solid var(--border);
    display:flex; z-index:30;
  }
  .tab-btn{
    flex:1; border:none; background:none; padding:12px 4px 14px; font-family:inherit;
    display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-muted); cursor:pointer;
  }
  .tab-btn svg{ width:20px;height:20px; }
  .tab-btn span{ font-size:10.5px; font-weight:600; }
  .tab-btn.active{ color:var(--teal-dark); }

  .banner-note{
    background:rgba(2,128,144,0.08); border:1px solid rgba(2,128,144,0.18); border-radius:12px;
    padding:12px 14px; font-size:12px; color:var(--teal-dark); line-height:1.5; margin-top:18px;
  }
  .back-btn{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none; font-family:inherit;
    color:var(--text-muted); font-size:13px; font-weight:600; padding:0 0 16px; cursor:pointer;
  }
  .back-btn svg{ width:14px;height:14px; }

  /* Mini Challenge 1 — semiconductor resilience banner on home */
  .resilience-banner{background:linear-gradient(135deg,var(--teal-dark),#075e63);color:#fff;border-radius:18px;padding:15px 16px;margin:0 0 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .resilience-banner::after{content:'∞';position:absolute;right:12px;top:-18px;font-size:92px;opacity:.06;font-weight:800}
  .resilience-banner .rb-top{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mint);font-weight:800}
  .resilience-banner b{display:block;font-size:15px;margin:4px 0}.resilience-banner span{font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.78)}

  .qr-stage{display:flex;flex-direction:column;align-items:center;text-align:center;padding:8px 0 4px}
  .qr-box{width:170px;height:170px;border:12px solid #fff;box-shadow:0 6px 20px -8px rgba(1,58,64,.3);border-radius:14px;background:repeating-conic-gradient(#0B2B2E 0 25%,#fff 0 50%) 50% / 28px 28px}
  .manual-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.manual-box label{display:block;font-size:11px;font-weight:700;color:var(--text-muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.7px}
  .manual-box input{width:100%;padding:13px;border:1.5px solid var(--border);border-radius:12px;font:inherit;font-size:15px;outline:none}.manual-box input:focus{border-color:var(--teal)}
  .mini-proof{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.proof-chip{background:rgba(2,195,154,.10);color:var(--teal-dark);border:1px solid rgba(2,195,154,.18);padding:6px 9px;border-radius:20px;font-size:10px;font-weight:700}

  .hidden{ display:none !important; }

.budget-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-top:16px}
.budget-head{display:flex;justify-content:space-between;align-items:flex-end}.budget-amount{font-family:'Fraunces',serif;font-size:34px;font-weight:700;color:var(--teal-dark)}.budget-sub{font-size:11px;color:var(--text-muted)}
.budget-bar{height:10px;background:#E1EEEC;border-radius:10px;overflow:hidden;margin:12px 0}.budget-fill{height:100%;background:var(--mint);border-radius:10px;transition:width .4s ease}
.mode-pill{display:inline-block;padding:5px 9px;border-radius:20px;background:rgba(2,195,154,.14);color:var(--mint);font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.metric{background:var(--off-white);border:1px solid var(--border);border-radius:12px;padding:11px}.metric b{display:block;font-size:16px;color:var(--teal-dark)}.metric span{font-size:10px;color:var(--text-muted)}
.challenge-card{background:linear-gradient(135deg,#013A40,#028090);color:#fff;border-radius:18px;padding:18px;margin-top:16px;box-shadow:var(--shadow)}.challenge-card h3{margin:0 0 6px;font-size:15px}.challenge-card p{margin:0;color:rgba(255,255,255,.82);font-size:12px;line-height:1.5}.btn-small{margin-top:12px;padding:10px 12px;border-radius:11px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.ai-flow{display:grid;gap:9px;margin-top:16px}.ai-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--border);border-radius:12px;background:#fff}.ai-dot{width:10px;height:10px;border-radius:50%;background:var(--mint);flex-shrink:0}.ai-row strong{font-size:12px}.ai-row span{display:block;font-size:10.5px;color:var(--text-muted);margin-top:2px}

.live-state-card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:16px;box-shadow:var(--shadow)}
.live-state-head{display:flex;justify-content:space-between;align-items:center}.live-state-title{font-size:15px;font-weight:800;color:var(--teal-dark)}.live-pill{font-size:9px;font-weight:800;color:var(--mint);background:rgba(2,195,154,.12);padding:6px 9px;border-radius:999px}.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.live-row{border:1px solid var(--border);border-radius:11px;padding:10px;display:flex;justify-content:space-between;font-size:11px}.live-row b{color:var(--teal-dark)}.live-row span{font-weight:800;color:var(--teal)}.truth-note{margin-top:11px;border-left:3px solid var(--mint);padding:9px 11px;background:#f3fbf8;border-radius:0 9px 9px 0;font-size:10.5px;color:var(--text-muted);line-height:1.45}
.state-action{margin-top:10px;width:100%;border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px;font:inherit;font-size:11px;font-weight:800;color:var(--teal-dark);cursor:pointer}.state-action:hover{background:#f3fbf8}
@media(max-width:600px){.live-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.4 2 4.5 5.7 4a5 5 0 0 1 6.3 2.2A5 5 0 0 1 18.3 4c3.7.5 5.3 4.4 3.7 7.7C19.5 16.4 12 21 12 21Z" fill="#fff"/></svg>
    </div>
    <div class="brand">MedEase<small>Recovery Companion</small></div>
  </header>

  <div class="journey-rail" id="journeyRail"></div>

  <main id="main"></main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>
      <span>Home</span>
    </button>
    <button class="tab-btn" data-tab="log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l1 3H8l1-3zM6 6h12l1 15H5L6 6z"/></svg>
      <span>Adherence Log</span>
    </button>
    <button class="tab-btn" data-tab="state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span>Live State</span>
    </button>
  </nav>
</div>

<script>
/* ---------------- Mock patient record (would come from hospital DB via patient ID) ---------------- */
let PATIENT = null;

async function api(path, options = {}) {
  const response = await fetch(path, {
    headers: {'Content-Type': 'application/json', ...(options.headers || {})},
    ...options
  });
  if (!response.ok) {
    throw new Error(`API ${response.status}`);
  }
  return response.json();
}

async function loadPatient(id = "MED-1042") {
  PATIENT = await api(`/api/patients/${encodeURIComponent(id)}`);
  return PATIENT;
}

const icons = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M4 12l5 5L20 6"/></svg>',
  pill: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="9" width="18" height="6" rx="3"/><path d="M9 9v6"/></svg>',
  walk: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><circle cx="13" cy="4" r="1.6"/><path d="M15 22l-2-6-3 2-2 4M8 14l1-5 4-1 3 3 3-1"/></svg>',
  ban: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M5 5l14 14"/></svg>',
  bandage: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(45 12 12)"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4"/><circle cx="12" cy="17" r="0.6" fill="#fff"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v12H4z"/><circle cx="12" cy="14" r="3.5"/></svg>',

let selectedLocation = 'Home';
let checklistLang = 'en';
let logs = [];

async function addLog(method, location){
  const eventType = method.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
  const event = { patient_id: PATIENT?.id || "MED-1042", method, location, event_type: eventType };
  try {
    const saved = await api('/api/events', {method:'POST', body:JSON.stringify(event)});
    logs.unshift({ method: saved.method, location: saved.location, time: new Date(saved.timestamp) });
  } catch(e) {
    // Keep the prototype usable if the API is temporarily unavailable.
    logs.unshift({ method, location, time: new Date() });
  }
}

/* ---------------- Journey rail (Round 1 continuity across the 4 mini challenges) ---------------- */
const JOURNEY = [
  {key:'access',    label:'01 · Access · NFC'},
  {key:'resilience',label:'02 · Resilience'},
  {key:'cost',      label:'03 · API Budget'},
  {key:'state',     label:'04 · Live State'},
];
function renderRail(activeKey){
  const order = JOURNEY.map(j=>j.key);
  const activeIdx = order.indexOf(activeKey);
  document.getElementById('journeyRail').innerHTML = JOURNEY.map((j,idx)=>{
    let cls = '';
    if(idx === activeIdx) cls = 'active';
    else if(activeIdx > -1 && idx < activeIdx) cls = 'done';
    return `<div class="jr-step ${cls}">${j.label}</div>`;
  }).join('');
}

/* Speak a checklist line aloud using the Web Speech API (works on Chrome/Edge/Android) */
function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
    u.rate = 0.95;
    window.speechSynthesis.speak(u);
  }catch(e){ /* speech synthesis unavailable — silently ignore for the demo */ }
}

function tryRealNfc(){
  if('NDEFReader' in window){
    try{
      const reader = new NDEFReader();
      reader.scan().then(()=>{
        document.getElementById('nfcHint').textContent = 'NFC reader active — bring the card close.';
        reader.onreading = () => onTapSuccess();
      }).catch(()=>{ /* permission denied or no NFC – simulate button still works */ });
    }catch(e){ /* NDEFReader not usable in this context */ }
  }
}

function onTapSuccess(){
  document.getElementById('nfcStatus').textContent = 'Card recognised — loading plan…';
  document.getElementById('nfcHint').textContent = 'Patient ID ' + PATIENT.id + ' matched.';
  addLog('NFC tap', selectedLocation).then(()=>setTimeout(()=> renderChecklist('NFC Tap · ' + selectedLocation), 550));

let apiBudget={limit:1500,used:420,mode:'OPTIMIZED',calls:7,local:91};
function apiMode(){let p=apiBudget.used/apiBudget.limit;return p>=1?'PROTECTED':p>=.7?'OPTIMIZED':'NORMAL';}
function simulateBudgetLimit(){apiBudget.used=1500;apiBudget.mode='PROTECTED';renderBudget();}
function renderBudget(){
  renderRail('cost');
  apiBudget.mode=apiMode();let pct=Math.min(100,Math.round(apiBudget.used/apiBudget.limit*100)),rem=Math.max(0,apiBudget.limit-apiBudget.used);
  document.getElementById('main').innerHTML=`<button class="back-btn" onclick="renderHome()">← Back</button><p class="eyebrow">Mini Challenge 3 · API resilience</p><h1 class="page-title">System health</h1><p class="page-sub">Hard ₹1,500 monthly API ceiling enforced through local processing, confidence routing and caching.</p>
  <div class="budget-card"><div class="budget-head"><div><div class="budget-sub">API BUDGET</div><div class="budget-amount">₹${rem.toLocaleString()}</div><div class="budget-sub">remaining of ₹1,500</div></div><span class="mode-pill">${apiBudget.mode}</span></div><div class="budget-bar"><div class="budget-fill" style="width:${pct}%"></div></div><div class="budget-sub">${pct}% of monthly budget used</div><div class="metric-grid"><div class="metric"><b>${apiBudget.local}</b><span>local / cached</span></div><div class="metric"><b>${apiBudget.calls}</b><span>paid AI calls</span></div><div class="metric"><b>₹${apiBudget.used}</b><span>API spend</span></div></div></div>
  <div class="challenge-card"><h3>${apiBudget.mode==='PROTECTED'?'₹1,500 ceiling reached':'AI-on-demand is active'}</h3><p>${apiBudget.mode==='PROTECTED'?'Discretionary AI calls are paused. Patient access continues through local OCR, clinical templates and cached translations.':'Only low-confidence or novel content reaches the paid model. Repeated outputs are reused.'}</p><button class="btn-small" onclick="${apiBudget.mode==='PROTECTED'?'apiBudget.used=420;apiBudget.calls=7;renderBudget()':'simulateBudgetLimit()'}">${apiBudget.mode==='PROTECTED'?'Reset simulation':'Simulate budget limit'}</button></div>
  <div class="ai-flow"><div class="ai-row"><div class="ai-dot"></div><div><strong>Local OCR / extraction first</strong><span>No paid API for routine processing.</span></div></div><div class="ai-row"><div class="ai-dot"></div><div><strong>Confidence gate</strong><span>Only ambiguous cases are candidates for AI.</span></div></div><div class="ai-row"><div class="ai-dot"></div><div><strong>Cache repeated results</strong><span>Common instructions and translations are reused.</span></div></div><div class="ai-row"><div class="ai-dot"></div><div><strong>Safety stays deterministic</strong><span>Dosage, dates and red-flag fields remain template-validated.</span></div></div></div>`;
  setActiveTab('log');
}

function liveCounts(){
  const med=logs.filter(x=>x.method==='Medication taken').length;
  const walk=logs.filter(x=>x.method==='Walking completed').length;
  const hydration=logs.filter(x=>x.method==='Hydration completed').length;
  return {med,walk,hydration};
}
async function renderLiveState(){
  renderRail('state');
  let serverState = null;
  try { serverState = await api(`/api/recovery-state/${encodeURIComponent(PATIENT?.id || "MED-1042")}`); } catch(e) {}
  const c = serverState ? {
    med: serverState.medication_completed,
    walk: serverState.walking_completed,
    hydration: serverState.hydration_completed
  } : liveCounts();
  const total=Math.min(2,c.med)+Math.min(4,c.walk)+Math.min(6,c.hydration);
  const done=2+4+6;
  const pct=Math.round(total/done*100);
  const latest=logs.length?new Date(logs[0].time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}):'No verified action yet';
  document.getElementById('main').innerHTML=`
    <button class="back-btn" onclick="renderHome()">← Back</button>
    <p class="eyebrow">Mini Challenge 4 · live recovery state</p>
    <h1 class="page-title">My recovery state</h1>
    <p class="page-sub">Calculated on demand from the latest verified events — not generated by the AI.</p>
    <div class="live-state-card">
      <div class="live-state-head"><div><div class="budget-sub">CURRENT STATUS</div><div class="live-state-title">${pct>=70?'🟢 ON TRACK':'🟡 NEEDS ATTENTION'}</div></div><span class="live-pill">VERIFIED STATE</span></div>
      <div class="live-grid">
        <div class="live-row"><b>💊 Medication</b><span>${Math.min(2,c.med)} / 2 ✓</span></div>
        <div class="live-row"><b>🚶 Walking</b><span>${Math.min(4,c.walk)} / 4 ✓</span></div>
        <div class="live-row"><b>💧 Hydration</b><span>${Math.min(6,c.hydration)} / 6 ✓</span></div>
        <div class="live-row"><b>📈 Recovery adherence</b><span>${pct}%</span></div>
      </div>
      <div style="margin-top:12px;font-size:11px"><b>Next action:</b> ${c.walk<4?'Complete your next walking session':'Continue according to your plan'}</div>
      <div class="truth-note"><b>Last verified: ${latest}</b><br>Every displayed number is derived from timestamped events in this prototype. If nothing new is recorded, the timestamp stays unchanged.</div>
      <button class="state-action" onclick="addLog('Medication taken','Home').then(()=>renderLiveState())">✓ Simulate verified medication event</button>
      <button class="state-action" onclick="addLog('Walking completed','Home').then(()=>renderLiveState())">✓ Simulate verified walking event</button>
      <button class="state-action" onclick="addLog('Hydration completed','Home').then(()=>renderLiveState())">✓ Simulate verified hydration event</button>
    </div>`;
  setActiveTab('state');
}

function runProcessing(){
  const steps = ['Reading document (OCR)', 'Identifying medicines & instructions', 'Simplifying into plain language'];
  let i = 0;
  document.getElementById('main').innerHTML = `
    <div class="processing">
      <div class="spinner"></div>
      <div class="step-list" id="stepList"></div>
    </div>
  `;
  const list = document.getElementById('stepList');
  function draw(){
    list.innerHTML = steps.map((s,idx)=>`
      <div class="step-row ${idx < i ? 'done':''}">
        <div class="step-dot"></div><div>${s}</div>
      </div>`).join('');
  }
  draw();
  const iv = setInterval(()=>{
    i++;
    draw();
    if(i >= steps.length){
      clearInterval(iv);
      setTimeout(()=>{ addLog('Photo upload', 'Home').then(()=>renderChecklist('Photo Upload')); }, 400);
    }
  }, 700);
}

function setActiveTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=> b.classList.toggle('active', b.dataset.tab===tab));
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if(btn.dataset.tab === 'home') renderHome();
    if(btn.dataset.tab === 'log') renderLog();
    if(btn.dataset.tab === 'state') renderLiveState();
  });
});

loadPatient().then(()=>renderHome()).catch(()=>renderHome());
